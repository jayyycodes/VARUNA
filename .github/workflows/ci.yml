name: VARUNA CI & Contract Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  contract-and-frontend:
    name: Frontend Contract & Static Anti-Leak Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check & Production Build
        working-directory: frontend
        run: npm run build

      - name: Validate Local Fixture Contracts
        working-directory: frontend
        run: npm run test:fixtures

  backend-integration:
    name: Full Backend Integration & Provenance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch FastAPI Backend in Background
        env:
          PORT: 8000
          HOST: 0.0.0.0
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Verify Backend Liveness
        run: |
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Backend Integration Audit Suite
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run audit:integration
