version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: varuna
      POSTGRES_USER: varuna
      POSTGRES_PASSWORD: varuna_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/002_geofencing_schema.sql:/docker-entrypoint-initdb.d/002_geofencing_schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
